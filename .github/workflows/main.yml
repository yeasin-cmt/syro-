
name: Prepare SYRO Hosting Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SYRO
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, pdo_mysql, curl, gd, intl, zip
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Laravel Dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Vite Assets
        run: npm run build

      - name: Create Hosting ZIP
        run: |
          zip -r syro-hosting.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".env" \
               "storage/logs/*" \
               "storage/framework/cache/*" \
               "storage/framework/sessions/*" \
               "storage/framework/views/*"

      - name: Upload Hosting Package
        uses: actions/upload-artifact@v4
        with:
          name: SYRO-HOSTING
          path: syro-hosting.zip
          retention-days: 7
